<script>
/* Redirection des anciennes adresses (le site vivait sous /eden-loot-prio-p3/,
   il est maintenant à la racine). Les filtres ?c=Classe et le hash sont
   conservés. Les autres 404 renvoient aussi à l'accueil, après le message. */
(function () {
  var ancien = '/eden-loot-prio-p3';
  if (location.pathname.indexOf(ancien) === 0) {
    var reste = location.pathname.slice(ancien.length).replace(/^\//, '');
    location.replace('/' + reste + location.search + location.hash);
  }
})();
</script>
